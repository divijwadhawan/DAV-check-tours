name: Manual programme check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python check_pages.py --once
      - uses: actions/upload-artifact@v4
        with:
          name: dav-courses
          path: output/
